<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Editable 3D garden model: seasons, growth over the years, sun and shade.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Garden Plan 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-height 3D garden with a time bar under it and a working panel beside it (stacked on phones) */
:root{
  --bg:#e8ece4; --panel:#f6f8f3; --raise:#ffffff; --fg:#1b2a21; --mute:#5b6b60; --line:#cdd6c9;
  --moss:#365f34; --moss-ink:#ffffff; --moss-soft:#dfe9d8; --soil:#8a5a3c; --sun:#d99a1e; --warn:#a4481f; --ok:#2f6b3a;
  --f-head:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121814; --panel:#18201b; --raise:#202a23; --fg:#e3ebe2; --mute:#9aab9f; --line:#334038;
  --moss:#8cc47e; --moss-ink:#0f1a10; --moss-soft:#25352a; --soil:#c08a64; --sun:#f0b840; --warn:#f08a5a; --ok:#8cc47e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121814; --panel:#18201b; --raise:#202a23; --fg:#e3ebe2; --mute:#9aab9f; --line:#334038;
  --moss:#8cc47e; --moss-ink:#0f1a10; --moss-soft:#25352a; --soil:#c08a64; --sun:#f0b840; --warn:#f08a5a; --ok:#8cc47e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
*{box-sizing:border-box}
#app{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:100%}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0}
#v{flex:1;position:relative;min-height:0;background:#cfe2f1;overflow:hidden}
#v canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#side{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding-block:14px 32px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:900px){
  #app{display:block;height:auto}
  #stage{height:auto}
  #v{height:58vh;min-height:340px;flex:none}
  #side{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}
}
h1{font:700 22px/1.1 var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font:700 15px/1.2 var(--f-head);margin:18px 0 8px;text-wrap:balance}
h2:first-child{margin-top:4px}
.eyebrow{font:500 11px/1 var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.small{font-size:12.5px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:6px 10px;line-height:1.2}
button:hover{border-color:var(--moss)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--moss);outline-offset:1px}
button.on{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
button.danger{color:var(--warn)}
select,input[type=number],input[type=text],textarea{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--moss);margin:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.field{display:grid;gap:3px;min-width:0}
.field>span{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute)}
.field>span b{font:500 12px var(--f-data);color:var(--fg)}
.stack{display:grid;gap:10px}
/* time bar */
#tb{background:var(--panel);border-top:1px solid var(--line);padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px}
@media (max-width:900px){#tb{padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media (max-width:640px){#tb{grid-template-columns:1fr}}
.tf{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px}
.tf .lab{grid-column:1/3;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.tf .lab b{font:600 13px var(--f-body)}
.tf .lab i{font:400 11.5px var(--f-data);font-style:normal;color:var(--mute);white-space:nowrap}
.tf input{grid-column:1/3}
.tf button{grid-row:1/3;grid-column:3;padding:5px 9px;font-size:12px}
#lights{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#lights button{font-size:12.5px;padding:5px 9px}
#lights .sep{flex:1}
/* overlays on the 3D view */
.ov{position:absolute;z-index:2}
#views{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:5px;max-width:calc(100% - 20px)}
#views button{background:color-mix(in srgb,var(--raise) 88%,transparent);backdrop-filter:blur(6px);font-size:12.5px;padding:5px 9px}
#views button.on{background:var(--moss)}
#read{left:max(10px,env(safe-area-inset-left,0px));bottom:10px;background:color-mix(in srgb,var(--raise) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:500 11.5px/1.45 var(--f-data);max-width:calc(100% - 20px);pointer-events:none}
#legend{right:max(10px,env(safe-area-inset-right,0px));bottom:10px;background:color-mix(in srgb,var(--raise) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:500 11px/1.3 var(--f-data);width:210px}
#legend .bar{height:9px;border-radius:3px;margin:5px 0 3px;background:linear-gradient(90deg,#2b2f6b,#5d58a8 22%,#3f9b8a 40%,#c9cf4f 62%,#f2b233 80%,#f7e08a)}
#legend .ticks{display:flex;justify-content:space-between;color:var(--mute)}
#probe{margin-top:5px;color:var(--fg)}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#223}
#hint{right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));font-size:11.5px;color:#203024;background:#ffffffb8;border-radius:6px;padding:4px 8px;pointer-events:none}
@media (max-width:640px){#hint{display:none}#legend{width:170px}}
/* versions */
.vbar{display:flex;gap:8px;align-items:flex-end;margin:0 0 12px}
.vbar .field{flex:1;min-width:0}
.vbar select{font-weight:500}
#vpanel{margin:-4px 0 14px;display:grid;gap:10px}
#vpanel .row{gap:6px}
.vnote{font-size:12px;color:var(--mute);margin:0}
/* side panel */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
#status{font:500 11px var(--f-data);color:var(--mute);text-align:right;white-space:nowrap}
#status.err{color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;border-radius:0;padding:8px 10px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--moss);font-weight:600}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 8px;min-width:0}
.pal button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.sw{flex:none;width:14px;height:14px;border-radius:50%;border:1px solid #0002}
.sw.sq{border-radius:3px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px}
.strip i{height:16px;border-radius:2px;position:relative;display:block}
.strip i.cur{outline:2px solid var(--fg);outline-offset:1px}
.strip i b{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;border:1px solid #0003}
.mon{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;font:500 9.5px var(--f-data);color:var(--mute);text-align:center;margin-top:2px}
.pill{display:inline-block;font:500 11px var(--f-data);padding:2px 7px;border-radius:99px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font:500 10.5px var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
td.n{font:500 12px var(--f-data);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--moss-soft)}
.list{overflow-x:auto}
textarea{resize:vertical;font:12px/1.4 var(--f-data)}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.empty{padding:18px 4px;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:auto;accent-color:var(--moss)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <div id="v">
      <div class="ov" id="views">
        <button data-view="over" class="on">Overview</button>
        <button data-view="plan">Plan</button>
        <button data-view="house">From the house</button>
        <button data-view="end">From the far end</button>
        <button id="hq" title="Realistic foliage, sky, textures and soft shadows">Realistic</button>
      </div>
      <div class="ov" id="hint">Drag to orbit · two fingers or right-drag to pan · drag a selected item to move it</div>
      <div class="ov" id="read"></div>
      <div class="ov" id="legend" hidden>
        <div><b>Direct sun at ground level</b></div>
        <div class="bar"></div>
        <div class="ticks"><span>0 h</span><span>3 h</span><span>6 h</span><span>9 h+</span></div>
        <div class="ticks"><span>Shade</span><span>Part shade</span><span>Full sun</span></div>
        <div id="probe" class="mute">Tap the ground to read a spot.</div>
      </div>
    </div>
    <div id="tb">
      <div class="tf"><div class="lab"><b id="lMonth">June</b><i>season</i></div><input id="month" type="range" min="1" max="12" step="1" value="6" aria-label="Month"><button id="playM">Play year</button></div>
      <div class="tf"><div class="lab"><b id="lYears">At planting</b><i id="lYear">2027</i></div><input id="years" type="range" min="0" max="30" step="1" value="0" aria-label="Years after planting"><button id="playY">Grow</button></div>
      <div class="tf"><div class="lab"><b id="lHour">14:00</b><i id="lSun"></i></div><input id="hour" type="range" min="0" max="24" step="0.25" value="14" aria-label="Time of day"><button id="playH">Run day</button></div>
      <div id="lights">
        <span class="eyebrow">Light</span>
        <button data-light="rise">Sunrise</button>
        <button data-light="morn">Morning</button>
        <button data-light="noon">Midday</button>
        <button data-light="aft">Afternoon</button>
        <button data-light="gold">Golden hour</button>
        <button data-light="dusk">Dusk</button>
        <span class="sep"></span>
        <button id="sunmap">Sun-hours map</button>
      </div>
    </div>
  </div>

  <aside id="side">
    <div class="head">
      <div><div class="eyebrow">Editable garden model</div><h1 id="title">Garden plan</h1></div>
      <div id="status">Starting…</div>
    </div>
    <div class="vbar">
      <label class="field"><span>Plan version</span><select id="vsel" aria-label="Plan version"></select></label>
      <button id="vsave">Save version</button>
    </div>
    <div id="vpanel" class="card" hidden></div>
    <div class="tabs" role="tablist">
      <button data-tab="add" class="on">Add</button>
      <button data-tab="sel">Selected</button>
      <button data-tab="list">Plant list</button>
      <button data-tab="site">Plot &amp; sun</button>
      <button data-tab="save">Save</button>
    </div>
    <section id="t-add"></section>
    <section id="t-sel" hidden></section>
    <section id="t-list" hidden></section>
    <section id="t-site" hidden></section>
    <section id="t-save" hidden></section>
  </aside>
</div>

function featSw(k){return {house:'#a65a40',shed:'#9a7650',pergola:'#9a7650',arch:'#2a2a2a',greenhouse:'#bcd3d8',raised:'#8a6a48',wall:'#a65a40',fence:'#7a5a3c',hedge:'#2a4630',patio:'#c9b896',path:'#cbc1a6',lawn:'#6aa042',border:'#5b4634',pond:'#2f5d6c',rill:'#2f5d6c',bowl:'#8a4a2a',seat:'#8a6a48',table:'#5a5f5c',firepit:'#ff8a2a'}[k]}
function strip(s){let h='<div class="strip">';for(let m=1;m<=12;m++){const fl=inFl(s,m)?s.fl[0]:(inFr(s,m)?s.fr[0]:null);h+=`<i class="${m===view.month?'cur':''}" style="background:${monthLook(s,m)}" title="${MONTHS[m-1]}">${fl?`<b style="background:${fl}"></b>`:''}</i>`}return h+'</div><div class="mon">'+[...MI].map(c=>`<span>${c}</span>`).join('')+'</div>'}
function num(key,label,min,max,step,val,unit='m'){return `<label class="field"><span>${label}<b id="o-${key}">${val}${unit?' '+unit:''}</b></span><input type="range" id="f-${key}" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`}
function sel(key,label,opts,val){return `<label class="field"><span>${label}</span><select id="f-${key}" data-k="${key}">${opts.map((o,i)=>{const [t,v]=Array.isArray(o)?o:[o,i];return `<option value="${v}"${String(v)===String(val)?' selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
function renderSel(){const el=$('#t-sel'),it=view.sel&&item(view.sel);
  if(!it){el.innerHTML=`<div class="empty">Nothing selected. Tap a plant or feature in the view, or pick one from the <b>Plant list</b>.</div>`;return}
  let h='';

    h+=`<div class="eyebrow">${esc(TYPES.find(t=>t[0]===s.t)[1])}</div><h2 style="margin-top:4px">${esc(nameOf(it))}</h2><div class="small mute"><i>${esc(s.b)}</i> · ${s.ev?'evergreen':'deciduous'}${s.st>1?' · '+s.st+' stems':''}</div>`;
    h+=`<div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><span class="small"><b>Through the year</b></span><span class="small mute">${s.fl?'dot = flowers'+(s.fr?' or fruit':''):''}</span></div>${strip(s)}
      <table style="margin-top:10px"><tr><th></th><th style="text-align:right">Height</th><th style="text-align:right">Spread</th></tr>
      <tr><td>Now (${S.site.start+view.years})</td><td class="n">${gr?r1(gr.h)+' m':'not planted'}</td><td class="n">${gr?r1(gr.w)+' m':'–'}</td></tr>
      <tr><td>Mature (about ${Math.round(s.k*2.3)} yrs)</td><td class="n">${r1(s.H*(it.sc||1))} m</td><td class="n">${r1(s.S*(it.sc||1))} m</td></tr></table>
      <div id="sunfit" class="small" style="margin-top:10px"></div></div>`;
    h+=`<div class="stack" style="margin-top:12px">${sel('sp','Plant',TYPES.flatMap(([t,l])=>Object.keys(SP).filter(k=>SP[k].t===t).map(k=>[l+': '+SP[k].n,k])),it.sp)}
      ${num('pl','Planted (years from start, negative if already there)',-40,15,1,it.pl||0,'yrs')}
      ${num('h0','Height when planted',.05,Math.max(6,s.H),.05,r2(it.h0??s.h0))}
      ${num('sc','Mature size (× typical)',.4,1.6,.05,it.sc||1,'')}
      ${s.t==='climb'?num('r','Facing',0,355,5,it.r||0,'°'):''}</div>`}
  else{const f=FEAT[it.k];h+=`<div class="eyebrow">${esc(f.c)}</div><h2 style="margin-top:4px">${esc(nameOf(it))}</h2><div class="stack" style="margin-top:10px">`;
    for(const fd of f.f){if(Array.isArray(fd[2]))h+=sel(fd[0],fd[1],fd[2].map((o,i)=>Array.isArray(o)?[o[0],(fd[0]==='sp'?o[1]:i)]:[o,i]),it[fd[0]]);else h+=num(fd[0],fd[1],fd[2],fd[3],fd[4],it[fd[0]],fd[0]==='pl'?'yrs':'m')}
    h+=num('r','Rotation',0,355,5,it.r||0,'°')+'</div>'}
  h+=`<div class="g2" style="margin-top:12px"><label class="field"><span>Across (x)</span><input type="number" id="f-x" data-k="x" step="0.05" value="${r2(it.x)}"></label><label class="field"><span>Along (z)</span><input type="number" id="f-z" data-k="z" step="0.05" value="${r2(it.z)}"></label></div>
   <div class="stack" style="margin-top:10px"><label class="field"><span>Label</span><input type="text" id="f-nm" data-k="nm" maxlength="60" value="${esc(it.nm||'')}" placeholder="${esc(it.k==='plant'?SP[it.sp].n:FEAT[it.k].n)}"></label>
   <label class="field"><span>Notes</span><textarea id="f-note" data-k="note" rows="2" maxlength="400" placeholder="Supplier, size bought, care notes">${esc(it.note||'')}</textarea></label>
   <label class="chk"><input type="checkbox" id="f-lock" ${it.lock?'checked':''}> Lock position</label></div>
   <div class="row" style="margin-top:12px"><button id="dup">Duplicate</button><button id="del" class="danger">Delete</button><button id="desel">Done</button></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-k]').forEach(inp=>{const k=inp.dataset.k;const ev=inp.tagName==='SELECT'||inp.type==='number'?'change':'input';
    inp.addEventListener(ev,()=>{let v=inp.value;if(inp.type==='range'||inp.type==='number')v=parseFloat(v);if(k==='mat'||k==='shape'||k==='step')v=parseInt(v);if(Number.isNaN(v))return;
      if(k==='nm'||k==='note'){it[k]=String(v).slice(0,k==='nm'?60:400);save();if(k==='nm'&&view.tab==='sel'){}return}
      it[k]=v;const o=$('#o-'+k);if(o)o.textContent=(k==='sc'?v:(k==='pl'||k==='r'?v:r2(v)))+(k==='pl'?' yrs':k==='r'?' °':k==='sc'?'':' m');
      rebuildOne(it.id);save();if(k==='sp'||k==='pl')renderSel();else if(it.k==='plant')sunFit()})});
  $('#f-lock').onchange=e=>{it.lock=e.target.checked?1:0;save()};
  $('#dup').onclick=()=>dupItem(it.id);$('#del').onclick=()=>delItem(it.id);$('#desel').onclick=()=>{select(null);tab('add')};
  if(it.k==='plant')sunFit()}
let sfT=0;function sunFit(){clearTimeout(sfT);sfT=setTimeout(()=>{const it=view.sel&&item(view.sel),el=$('#sunfit');if(!it||it.k!=='plant'||!el)return;const s=SP[it.sp];
  const hJ=sunHoursAt(it.x,it.z,it.id,.3),[a,b]=s.sun,okk=hJ>=a-.25&&hJ<=b+.25;
  const want=b<24?`${a} to ${b} h`:`${a} h or more`;
  el.innerHTML=`<span class="pill ${okk?'ok':'warn'}">${okk?'Suits this spot':'Check this spot'}</span> This spot gets about <b>${r1(hJ)} h</b> of direct sun in ${MONTHS[view.month-1]}; ${esc(s.n.toLowerCase())} prefers ${want}.`},120)}
function renderList(){const el=$('#t-list');const plants=S.items.filter(i=>i.k==='plant'),feats=S.items.filter(i=>i.k!=='plant');
  if(!S.items.length){el.innerHTML='<div class="empty">The plan is empty. Add plants and features from the Add tab.</div>';return}
  const by={};for(const p of plants)(by[p.sp]=by[p.sp]||[]).push(p);
  let h=`<p class="small mute" style="margin:0 0 6px">Sizes in ${S.site.start+view.years}, ${view.years?view.years+' years after planting':'at planting'}. Tap a row to select the first one.</p><div class="list"><table><tr><th>Plant</th><th style="text-align:right">No.</th><th style="text-align:right">H × S</th></tr>`;
  for(const [t] of TYPES)for(const k in by){const s=SP[k];if(s.t!==t)continue;const gr=grow(by[k][0],view.years);
    h+=`<tr class="click" data-id="${by[k][0].id}"><td><b>${esc(s.n)}</b><div class="mute" style="font-size:11.5px"><i>${esc(s.b)}</i></div>${strip(s)}</td><td class="n">${by[k].length}</td><td class="n">${gr?r1(gr.h)+' × '+r1(gr.w):'–'}</td></tr>`}
  h+=`</table></div><h2>Features</h2><div class="list"><table><tr><th>Feature</th><th style="text-align:right">Size</th></tr>`;
  for(const f of feats){const sz=f.len?`${r1(f.len)} m`:(f.w&&f.d)?`${r1(f.w)} × ${r1(f.d)} m`:f.dia?`⌀ ${r1(f.dia)} m`:f.w?`${r1(f.w)} m`:'';h+=`<tr class="click" data-id="${f.id}"><td>${esc(nameOf(f))}${f.nm?` <span class="mute">· ${esc(FEAT[f.k].n)}</span>`:''}</td><td class="n">${sz}</td></tr>`}
  el.innerHTML=h+'</table></div>';el.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>{select(r.dataset.id,true);const it=item(r.dataset.id);if(ok&&it)tgt.set(it.x,0,it.z)})}
function renderSite(){const el=$('#t-site'),p=S.plot,st=S.site,u=S.under;
  let h=`<h2>Plot</h2><div class="g2">${numIn('pw','Width (m)',p.w,.1)}${numIn('pd','Depth (m)',p.d,.1)}</div>
  <label class="field" style="margin-top:8px"><span>Boundary corners (optional), one “x, z” pair per line in metres</span><textarea id="pts" rows="4" placeholder="0, 0&#10;12, 0&#10;12.6, 32&#10;0, 31">${esc((p.pts||[]).map(q=>q.join(', ')).join('\n'))}</textarea></label>
  <div class="row" style="margin-top:6px"><button id="ptsA">Apply corners</button><button id="ptsC">Use rectangle</button></div>
  <p class="note">x runs across the plot, z runs from the far end (0) towards the house. Corners override width and depth.</p>
  <h2>Orientation and location</h2><div class="stack">
  ${num('bear','Facing of the garden, from the house looking out',0,355,5,st.bearing,'°')}
  <div class="small mute" id="bearTxt">Looking out from the house you face ${cmp(st.bearing)}. ${bearNote(st.bearing)}</div>
  <div class="g2">${numIn('lat','Latitude',st.lat,.01)}${numIn('lon','Longitude (east +)',st.lon,.01)}${numIn('tz','Standard time vs UTC (h)',st.tz,.5)}${numIn('start','First planting year',st.start,1)}</div>
  <label class="chk"><input type="checkbox" id="dst" ${st.dst?'checked':''}> Clocks go forward in summer (BST)</label>
  <p class="note">The default location is central London. A town-level figure is enough for sun angles.</p></div>
  <h2>Plan or aerial image</h2>
  <p class="small mute" style="margin:0 0 8px">Lay the deed plan or an aerial photo under the model, scale it to the plot and trace over it.</p>
  <div class="row"><input type="file" id="uf" accept="image/*" hidden><button id="ub">${u?'Replace image':'Upload image'}</button>${u?'<button id="ux" class="danger">Remove image</button>':''}</div>
  <p class="note" id="unote">${assets?'Images are stored with this page.':'Images uploaded here are kept in this browser only.'}</p>`;
  if(u)h+=`<div class="stack" style="margin-top:8px">${num('uw','Image width on the ground',2,200,.1,u.w)}<div class="g2">${numIn('ux2','Centre x',u.x,.1)}${numIn('uz','Centre z',u.z,.1)}</div>${num('urot','Rotate image',-180,180,.5,u.rot||0,'°')}${num('uop','Opacity',.1,1,.05,u.op??.8,'')}
   <label class="chk"><input type="checkbox" id="ushow" ${u.show?'checked':''}> Show image</label><label class="chk"><input type="checkbox" id="utop" ${u.top?'checked':''}> Draw over everything (for tracing)</label></div>`;
  el.innerHTML=h;
  const on=(id,fn,ev='change')=>{const x=$('#'+id);if(x)x.addEventListener(ev,fn)};
  on('pw',e=>{p.w=clamp(+e.target.value||1,1,300);if(!p.pts){buildPlot();dirtySun();save()}});
  on('pd',e=>{p.d=clamp(+e.target.value||1,1,300);if(!p.pts){buildPlot();dirtySun();save()}});
  $('#ptsA').onclick=()=>{const pts=$('#pts').value.split('\n').map(l=>l.split(/[,\s]+/).filter(Boolean).map(Number)).filter(a=>a.length>=2&&a.every(Number.isFinite)).map(a=>[a[0],a[1]]);
    if(pts.length<3){$('#pts').value='Enter at least three corners, one “x, z” pair per line.';return}p.pts=pts;buildPlot();dirtySun();save();renderSite()};
  $('#ptsC').onclick=()=>{p.pts=null;buildPlot();dirtySun();save();renderSite()};
  on('f-bear',e=>{st.bearing=+e.target.value;$('#o-bear').textContent=st.bearing+' °';$('#bearTxt').textContent=`Looking out from the house you face ${cmp(st.bearing)}. ${bearNote(st.bearing)}`;buildPlot();applyLight();dirtySun();save()},'input');
  for(const [id,k,a,b] of[['lat','lat',-66,66],['lon','lon',-180,180],['tz','tz',-12,14],['start','start',1900,2200]])on(id,e=>{const v=+e.target.value;if(!Number.isFinite(v))return;st[k]=clamp(v,a,b);applyLight();dirtySun();updTime();save()});
  on('dst',e=>{st.dst=e.target.checked?1:0;applyLight();dirtySun();save()});
  $('#ub').onclick=()=>$('#uf').click();
  on('uf',e=>{const f=e.target.files[0];if(f)uploadUnder(f)});
  on('ux',()=>{S.under=null;try{localStorage.removeItem('gp-under')}catch(e){}buildUnder();save();renderSite()},'click');
  if(u){const U=(id,k,ev='input')=>on(id,e=>{u[k]=+e.target.value;const o=$('#o-'+id.replace(/^f-/,''));if(o)o.textContent=e.target.value+(id==='urot'?' °':id==='uop'?'':' m');buildUnder();save()},ev);
    U('f-uw','w');U('ux2','x','change');U('uz','z','change');U('f-urot','rot');U('f-uop','op');
    on('ushow',e=>{u.show=e.target.checked;buildUnder();save()});on('utop',e=>{u.top=e.target.checked;buildUnder();save()})}
}
function numIn(id,label,val,step){return `<label class="field"><span>${label}</span><input type="number" id="${id}" step="${step}" value="${val}"></label>`}
function bearNote(b){const d=((b%360)+360)%360;if(d>=135&&d<=225)return 'A south-facing garden: the house rarely shades it.';if(d<=45||d>=315)return 'A north-facing garden: the house shades the near end for much of the year.';return d<180?'An east-facing garden: morning sun, shade from the house in the afternoon.':'A west-facing garden: shade in the morning, evening sun.'}
async function uploadUnder(f){const bb=bbox();const base={w:Math.round(Math.max(bb.w,bb.d)*1.1*10)/10,x:bb.cx,z:bb.cz,rot:0,op:.8,show:true,top:false};
  setStatus('Uploading image…');
  if(assets){try{const r=await assets.upload(f);S.under={...base,...(S.under||{}),asset:r.id,show:true};underTex=null;buildUnder();save();renderSite();return}catch(e){setStatus('Could not store the image with the page. Keeping it in this browser.',true)}}
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),sc=Math.min(1,1600/Math.max(img.width,img.height));c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',.82);try{localStorage.setItem('gp-under',url)}catch(e){setStatus('The image is too large to keep in this browser.',true)}S.under={...base,...(S.under||{}),asset:null,show:true};underTex=null;buildUnder();save();renderSite()};img.src=rd.result};rd.readAsDataURL(f)}
function renderSave(){const el=$('#t-save');el.innerHTML=`<h2>Plan name</h2><input type="text" id="pname" maxlength="80" value="${esc(S.name||'')}">
  <h2>Copy or move a plan</h2><p class="small mute" style="margin:0 0 8px">Copy the whole plan as text to keep a version or send it to someone. Paste a copied plan to load it.</p>
  <div class="row"><button id="cp">Copy plan</button><button id="ap">Load pasted plan</button></div>
  <textarea id="tx" rows="4" style="margin-top:8px" placeholder="Paste a copied plan here"></textarea>
  <h2>Start again</h2><div class="row">${EMBED?'<button id="sh">Reset to the shared plan</button>':''}<button id="ex">Load the example garden</button><button id="clr" class="danger">Clear all items</button></div>
  <div id="confirm" class="card" hidden style="margin-top:10px"><p style="margin:0 0 8px" id="cq"></p><div class="row"><button id="cy" class="danger">Yes, replace</button><button id="cn">Cancel</button></div></div>
  <h2>How it works</h2><p class="note">Growth follows each plant's typical height and spread, reached in roughly two to three times its growth period. Real growth depends on soil, water and pruning. Sun hours are for the 15th of the chosen month, measured at ground level, and count the house, walls, fences, hedges, pergolas and the canopy of anything over 1.1 m. Leafless trees let about 70% of light through.</p>`;
  $('#pname').onchange=e=>{S.name=e.target.value.slice(0,80);$('#title').textContent=S.name||'Garden plan';save()};
  const tx=$('#tx');$('#cp').onclick=async()=>{tx.value=JSON.stringify(S);tx.select();try{await navigator.clipboard.writeText(tx.value);setStatus('Plan copied')}catch(e){setStatus('Select the text and copy it')}};
  $('#ap').onclick=()=>{try{const p=JSON.parse(tx.value);if(!loadPlan(p))throw 0;save();setStatus('Plan loaded')}catch(e){tx.value='That text is not a plan. Paste the full text from Copy plan.'}};
  let pend=null;const ask=(q,fn)=>{pend=fn;$('#cq').textContent=q;$('#confirm').hidden=false};
  if($('#sh'))$('#sh').onclick=()=>ask('Replace the current plan with the shared plan?',()=>{loadPlan(EMBED.plan);save()});
  $('#ex').onclick=()=>ask('Replace the current plan with the example garden?',()=>{loadPlan(example());save()});
  $('#clr').onclick=()=>ask('Remove every plant and feature? The plot and orientation stay.',()=>{S.items=[];view.sel=null;rebuildAll();save();renderSave()});
  $('#cy').onclick=()=>{$('#confirm').hidden=true;pend&&pend()};$('#cn').onclick=()=>{$('#confirm').hidden=true}}

/* ---------- time controls ---------- */
function updTime(){$('#lMonth').textContent=MONTHS[view.month-1];$('#lYears').textContent=view.years?`${view.years} year${view.years>1?'s':''} after planting`:'At planting';$('#lYear').textContent=S.site.start+view.years;$('#month').value=view.month;$('#years').value=view.years;$('#hour').value=view.hour}
$('#month').addEventListener('input',e=>{view.month=+e.target.value;updTime();queueRebuild();applyLight();sideRefresh()});
$('#years').addEventListener('input',e=>{view.years=+e.target.value;updTime();queueRebuild();sideRefresh()});
$('#hour').addEventListener('input',e=>{view.hour=+e.target.value;applyLight()});
let sideT=0;function sideRefresh(){clearTimeout(sideT);sideT=setTimeout(()=>{if(view.tab==='sel'||view.tab==='list')tab(view.tab)},150)}
const plays={};function play(id,fn,ms){const b=$('#'+id);if(plays[id]){clearInterval(plays[id]);plays[id]=0;b.classList.remove('on');return}b.classList.add('on');plays[id]=setInterval(()=>{if(fn()===false){clearInterval(plays[id]);plays[id]=0;b.classList.remove('on')}},ms)}
$('#playM').onclick=()=>play('playM',()=>{view.month=view.month%12+1;updTime();queueRebuild();applyLight();sideRefresh()},700);
$('#playY').onclick=()=>{if(!plays.playY&&view.years>=30){view.years=0}play('playY',()=>{if(view.years>=30)return false;view.years++;updTime();queueRebuild();sideRefresh()},450)};
$('#playH').onclick=()=>{const dt=dayTimes(view.month);if(!plays.playH)view.hour=Math.max(0,Math.floor((dt.rise-.5)*4)/4);play('playH',()=>{view.hour+=.25;if(view.hour>Math.min(24,dt.set+.75)){return false}updTime();applyLight()},90)};
$$('[data-light]').forEach(b=>b.onclick=()=>{const dt=dayTimes(view.month);const k=b.dataset.light;
  view.hour=clamp({rise:dt.rise+.25,morn:(dt.rise+dt.noon)/2,noon:dt.noon,aft:(dt.noon+dt.set)/2,gold:dt.set-.75,dusk:dt.set+.3}[k],0,24);view.hour=Math.round(view.hour*4)/4;updTime();applyLight()});
$('#sunmap').onclick=()=>{view.sun=!view.sun;$('#sunmap').classList.toggle('on',view.sun);$('#legend').hidden=!view.sun;if(view.sun)computeSun();else computeSun()};
$$('#views [data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

/* ---------- start ---------- */
if(ok){if(HQ)initSky();toneMap();if(HQ&&!COARSE){sunL.shadow.mapSize.set(4096,4096)}buildPlot();rebuildAll();setView('over')}
$('#hq').classList.toggle('on',HQ);$('#hq').onclick=()=>setHQ(!HQ);
applyLightSafe();renderAll();opened.json=JSON.stringify(S);renderVbar();initStore();
function applyLightSafe(){try{applyLight()}catch(e){}}
})();
